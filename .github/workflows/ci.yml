name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest anyio
        pip install -e .

    - name: Run Ruff Linter
      run: |
        ruff check .

    - name: Run Test Suite
      run: |
        pytest tests/

  monitor-browser-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: 'npm'

    # The browser test harness (tests/browser/helpers.js) shells out to `uv run` to scaffold
    # and seed projects, matching the documented local dev workflow — so uv must be on PATH here.
    - name: Set up uv
      uses: astral-sh/setup-uv@v3

    - name: Sync Python dependencies
      run: uv sync

    - name: Install npm dependencies
      run: npm ci

    - name: Run monitor.html browser test suite
      run: npm run test:monitor
