                            // Structured handoff event — covers all four mechanisms (LLM
                            // transfer_agent tool call, conditional router, root router, semantic
                            // auto_route). Previously this only fired for transfer_agent, detected
                            // by regexing the literal text "Transferred to X" out of a tool result
                            // — router- and auto_route-driven handoffs never animated the graph.
                            const target = event.data?.to;
                            if (target) {
                                setStreamingAgent(target);
                                setEdges(eds => eds.map(edge => {
                                    if (edge.target === target) {
                                        return { ...edge, animated: true, style: { stroke: '#10b981', strokeWidth: 3 } };
                                    }
                                    return { ...edge, animated: false, style: {} };
                                }));
                                setTimeout(() => setEdges(eds => eds.map(edge => ({ ...edge, animated: false, style: {} }))), 3000);
                            }
                        } else if (event.type === 'tool_call') {
                            const toolNodeId = `tool-${activeAgent}-${event.data.tool}`;
                            // Flash the tool edge
                            setEdges(eds => eds.map(edge => {
                                if (edge.target === toolNodeId) {
                                    return { ...edge, animated: true, style: { stroke: '#eab308', strokeWidth: 3 } };
                                }
                                return edge;
                            }));
                            setTimeout(() => setEdges(eds => eds.map(edge => (edge.target === toolNodeId ? { ...edge, animated: false, style: {} } : edge))), 2000);
                        } else if (event.type === 'error') {
                            // Previously errors had no SSE event at all — an error happening while
                            // you watched the dashboard was completely invisible in the UI.
                            const id = `${Date.now()}-${Math.random()}`;
                            setLiveErrors(prev => [...prev.slice(-4), { id, message: event.data?.message || 'Unknown error', context: event.context }]);
                            setTimeout(() => setLiveErrors(prev => prev.filter(err => err.id !== id)), 12000);
                        } else if (event.type === 'router_decision') {
                            // Tracer.log_router_decision has always emitted this event — this is
                            // the first place anything renders it. A router/available_when
                            // condition that simply evaluated false is routine (most routers don't
                            // fire most turns) and stays a debug-level log line only, same as
                            // before, to avoid drowning the UI in expected non-events. A condition
                            // that *raised* (most commonly a typo'd state-key name) is different:
                            // it fails open/closed silently by design, so without this it's
                            // invisible even to someone watching the dashboard live.
                            if (event.data?.error) {
                                const id = `${Date.now()}-${Math.random()}`;
                                setLiveRouterIssues(prev => [...prev.slice(-4), {
                                    id,
                                    description: event.data.description,
                                    error: event.data.error,
                                }]);
                                setTimeout(() => setLiveRouterIssues(prev => prev.filter(r => r.id !== id)), 15000);
                            }
                        } else if (event.type === 'agent_spawned') {
                            // A dynamically-created agent (see spawn_agent, ai.yaml's `spawns:`)
                            // doesn't exist in ai.yaml at all, so fetchConfig/the static graph can
                            // never know about it — this is the only place it becomes visible.
                            // Rendered as a dashed "ephemeral" node layered on top of the static
                            // graph (see displayNodes/displayEdges), never written back to
                            // ai.yaml, so it naturally disappears again on a page refresh once
                            // the session ends.
                            const { from, to, role } = event.data || {};
                            if (to) {
                                setDynamicAgentNodes(prev => [
                                    ...prev.filter(n => n.id !== to),
                                    {
                                        id: to,
                                        type: 'default',
                                        sourcePosition: 'bottom',
                                        targetPosition: 'top',
                                        position: {
                                            x: 50 + (prev.length % 4) * 260,
                                            y: 560 + Math.floor(prev.length / 4) * 140,
                                        },
                                        data: {
                                            ephemeral: true,
                                            label: (
                                                <div dangerouslySetInnerHTML={{
                                                    __html: `
                                                        <div class="flex items-center gap-3 w-full overflow-hidden">
                                                            <div class="flex-shrink-0 w-8 h-8 rounded-md bg-white/5 flex items-center justify-center text-lg">🌱</div>
                                                            <div class="flex flex-col text-left min-w-0 flex-1">
                                                                <span class="text-sm font-medium text-neutral-100 truncate w-full" title="${role || 'Specialist'}">${role || 'Specialist'}</span>
                                                                <span class="text-xs text-amber-500 truncate w-full">Ephemeral · spawned</span>
                                                            </div>
                                                        </div>
                                                    `
                                                }} />
                                            ),
                                        },
                                        style: {
                                            width: 240, padding: '12px', borderRadius: '12px',
                                            border: '2px dashed #eab308',
                                            background: 'rgba(234, 179, 8, 0.06)',
                                        },
                                    },
                                ]);
                                if (from) {
                                    setDynamicAgentEdges(prevE => [
                                        ...prevE.filter(edge => edge.id !== `e-dyn-${from}-${to}`),
                                        {
                                            id: `e-dyn-${from}-${to}`,
                                            source: from,
                                            target: to,
                                            animated: true,
                                            style: { stroke: '#eab308', strokeWidth: 2, strokeDasharray: '5,5' },
                                        },
                                    ]);
                                }
                                setStreamingAgent(to);
                            }
                        } else if (event.type === 'agent_retired') {
                            const { agent, returned_to } = event.data || {};
                            if (agent) {
                                setDynamicAgentNodes(prev => prev.filter(n => n.id !== agent));
                                setDynamicAgentEdges(prev => prev.filter(edge => edge.target !== agent));
                                if (returned_to) setStreamingAgent(returned_to);
                            }
                        }
                    } catch (err) { }
                };
                return () => sse.close();
            }, [activeAgent]);

            const onEdgesDelete = useCallback(async (edgesToDelete) => {
                for (const edge of edgesToDelete) {
                    if (edge.source === 'user' || edge.source.startsWith('tool-') || edge.target.startsWith('tool-')) continue;
                    try {
                        const res = await fetch('/api/graph/sync', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                agent_id: edge.source,
                                target_id: edge.target,
                                edge_type: 'handoff',
                                action: 'remove'
                            })
                        });
                        if (!res.ok) throw new Error("Delete failed");
                    } catch (e) {
                        console.error("Failed to delete edge in ai.yaml", e);
                        alert("Failed to delete connection from ai.yaml.");
                    }
                }
            }, []);

            const onNodesDelete = useCallback((nodesToDelete) => {
                alert("Node deletion is disabled in the UI to prevent data loss. Please remove the agent directly from ai.yaml or blueprint.md.");
                fetchConfig(); // Refresh to restore the deleted node in the UI
            }, []);

            // Fires once when a drag gesture ends (not on every intermediate frame — dragging a
            // node fires many onNodesChange position events, and writing to localStorage on each
            // one would be both wasteful and janky). Reads the current stored map fresh from
            // localStorage rather than closing over `nodes` state, so this callback never needs
            // `nodes` in its dependency array and ReactFlow never has to re-subscribe it.
            const onNodeDragStop = useCallback((event, node) => {
                const projectName = configNameRef.current;
                if (!projectName) return;
                try {
                    const key = STUDIO_LAYOUT_PREFIX + projectName;
                    const stored = loadStoredLayout(projectName);
                    stored[node.id] = node.position;
                    localStorage.setItem(key, JSON.stringify(stored));
                } catch (e) {
                    console.error('Failed to save Studio layout position', e);
                }
            }, []);

            const onConnect = useCallback(async (params) => {
                const { source, target } = params;
                // Don't sync internal/fake nodes
                if (source === 'user' || source.startsWith('tool-') || target.startsWith('tool-')) {
                    setEdges((eds) => addEdge(params, eds));
                    return;
                }

                try {
                    const res = await fetch('/api/graph/sync', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            agent_id: source,
                            target_id: target,
                            edge_type: 'handoff'
                        })
                    });
                    if (!res.ok) throw new Error("Sync failed");

                    setEdges((eds) => addEdge({ ...params, style: { stroke: '#10b981', strokeWidth: 2, animation: 'dash 1s linear infinite' } }, eds));
                } catch (e) {
                    console.error("Failed to sync edge to ai.yaml", e);
                    alert("Failed to sync structural change to ai.yaml.");
                }
            }, []);

            const fetchConfig = async () => {
                try {
                    const res = await fetch('/api/config');
                    const data = await res.json();

                    if (data.name) {
                        configNameRef.current = data.name;
                        setProjectName(data.name);
                    }
                    if (data._context_window) setContextWindow(data._context_window);

                    let newNodes = [];
                    let newEdges = [];

                    const createHtmlLabel = (icon, title, subtitle) => `
                        <div class="flex items-center gap-3 w-full overflow-hidden">
                            <div class="flex-shrink-0 w-8 h-8 rounded-md bg-white/5 flex items-center justify-center text-lg">${icon}</div>
                            <div class="flex flex-col text-left min-w-0 flex-1">
                                <span class="text-sm font-medium text-neutral-100 truncate w-full" title="${title}">${title}</span>
                                ${subtitle ? `<span class="text-xs text-neutral-400 truncate w-full">${subtitle}</span>` : ''}
                            </div>
                        </div>
                    `;

                    // Node chrome is inline styles (ReactFlow reads style objects directly, not
                    // Tailwind classes) so it can't ride the CSS-variable retrofit — pick the
                    // literal per theme instead, same background/surface/border values as the
                    // Tailwind tokens.
                    const isLight = themeRef.current === 'light';
                    const bgColor = isLight ? '#fafafa' : '#0a0a0a';
                    const surfaceColor = isLight ? '#ffffff' : '#171717';
                    const borderColor = isLight ? '#e5e5e5' : '#262626';

                    const formatTitle = (str) => {
                        return str.replace(/_/g, ' ')
                            .split(' ')
                            .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                            .join(' ');
                    };

                    newNodes.push({
                        id: 'user',
                        type: 'default',
                        sourcePosition: 'bottom',
                        targetPosition: 'top',
                        data: { label: <div dangerouslySetInnerHTML={{ __html: createHtmlLabel('👤', 'User', 'Input Entry') }} /> },
                        position: { x: 300, y: 50 },
                        style: { background: bgColor, width: 220, padding: '12px', border: `1px solid ${borderColor}`, borderRadius: '12px' }
                    });

                    if (data.default_agent) {
                        newEdges.push({
                            id: `e-user-${data.default_agent}`,
                            source: 'user',
                            target: data.default_agent,
                            animated: true,
                            style: { stroke: '#6366f1', strokeWidth: 2 }
                        });
                    }

                    let yOffset = 200;
                    let xOffset = 50;

                    if (data.agents) {
                        Object.entries(data.agents).forEach(([agentName, agentData], index) => {
                            newNodes.push({
                                id: agentName,
                                type: 'default',
                                sourcePosition: 'bottom',
                                targetPosition: 'top',
                                data: { label: <div dangerouslySetInnerHTML={{ __html: createHtmlLabel('🤖', formatTitle(agentName), 'Agent') }} /> },
                                position: { x: xOffset + (index * 280), y: yOffset },
                                style: { background: surfaceColor, width: 240, padding: '12px', border: '1px solid #6366f150', borderRadius: '12px', boxShadow: '0 4px 20px -5px rgba(99,102,241,0.1)' }
                            });

                            if (agentData.handoffs) {
                                agentData.handoffs.forEach(handoff => {
                                    newEdges.push({
                                        id: `e-${agentName}-${handoff}`,
                                        source: agentName,
                                        target: handoff,
                                        markerEnd: { type: MarkerType.ArrowClosed, color: '#6366f1' },
                                        style: { stroke: '#6366f1', strokeWidth: 2 }
                                    });
                                });
                            }

                            if (agentData.tools) {
                                agentData.tools.forEach((t, tIdx) => {
                                    const toolId = `tool-${agentName}-${t.name}`;
                                    newNodes.push({
                                        id: toolId,
                                        type: 'default',
                                        sourcePosition: 'bottom',
                                        targetPosition: 'top',
                                        data: { label: <div dangerouslySetInnerHTML={{ __html: createHtmlLabel('🔧', formatTitle(t.name), 'Tool / MCP') }} /> },
                                        position: { x: xOffset + (index * 280) + (tIdx * 10) + 10, y: yOffset + 140 + (tIdx * 80) },
                                        style: { background: bgColor, width: 240, padding: '10px', border: `1px solid ${borderColor}`, borderRadius: '8px' }
                                    });
                                    newEdges.push({
                                        id: `e-${agentName}-${toolId}`,
                                        source: agentName,
                                        target: toolId,
                                        animated: true,
                                        style: { stroke: '#6366f1', strokeDasharray: '4,4' }
                                    });
                                });
                            }
                        });
                    }

                    // Preserve any position the user already dragged a node to — fetchConfig runs
                    // on a 3s poll, and newNodes above always computes fresh formulaic positions,
                    // so overwriting wholesale snapped every manual rearrangement straight back.
                    // Checked in two layers: prevNodes (in-memory React state) first, since it's
                    // the freshest source within this page session; storedLayout (localStorage)
                    // second, so a position survives a browser refresh too, when prevNodes is
                    // still the empty initial state and has nothing to offer. Only brand-new node
                    // ids (a newly added agent/tool, present in neither) get the computed default.
                    const storedLayout = loadStoredLayout(data.name);
                    setNodes((prevNodes) => {
                        const prevPositionById = new Map(prevNodes.map((n) => [n.id, n.position]));
                        return newNodes.map((n) => {
                            const prevPosition = prevPositionById.get(n.id) || storedLayout[n.id];
                            return prevPosition ? { ...n, position: prevPosition } : n;
                        });
                    });
                    setEdges(newEdges);
                } catch (e) {
                    console.error("Config fetch error:", e);
                }
            };

            const fetchMemory = async () => {
                try {
                    const res = await fetch('/api/memory');
                    const data = await res.json();
                    if (Array.isArray(data)) {
                        setSessions(data);
                    } else {
                        console.error("Backend Error fetching memory:", data);
                        setSessions([]);
                    }
                } catch (e) {
                    console.error("Network Error fetching memory:", e);
                    setSessions([]);
                }
            };

            const handleManualSync = () => {
                fetchConfig();
                fetchMemory();
            };

            const handleBlueprintSync = async () => {
                try {
                    const btn = document.activeElement;
                    if (btn) btn.disabled = true;
                    const response = await fetch('/api/blueprint/sync', { method: 'POST' });
                    if (!response.ok) throw new Error('Failed to sync blueprint');
                    alert('Successfully reverse-synced ai.yaml to blueprint.md!');
                } catch (e) {
                    alert(e.message);
                } finally {
                    const btn = document.activeElement;
                    if (btn) btn.disabled = false;
                }
            };

            useEffect(() => {
                fetchConfig();
                fetchMemory();
                const interval = setInterval(() => {
                    fetchConfig();
                    fetchMemory();
                }, 3000);
                return () => clearInterval(interval);
            }, []);

            return (
                <div className="flex flex-col h-full bg-background w-full">
                    {/* Live error toasts — visible on any tab. Backend errors previously had no
                        SSE event at all, so a failure happening while you watched the dashboard
                        was invisible unless you were also tailing the terminal. */}
                    {liveErrors.length > 0 && (
                        <div className="fixed top-20 right-4 z-50 flex flex-col gap-2 w-96 max-w-[90vw]">
                            {liveErrors.map(err => (
                                <div key={err.id} className="bg-red-950/95 border border-red-500/50 rounded-lg shadow-xl p-3 backdrop-blur-md animate-[pulse_0.3s_ease-in-out]">
                                    <div className="flex items-start gap-2">
                                        <svg className="w-4 h-4 text-red-400 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                                        <div className="flex-1 min-w-0">
                                            <div className="text-xs font-bold text-red-300 uppercase tracking-wide">
                                                Error{err.context?.session_id ? ` · ${err.context.session_id}` : ''}{err.context?.agent ? ` · ${err.context.agent}` : ''}
                                            </div>
                                            <div className="text-xs text-red-200/90 mt-1 break-words">{err.message}</div>
                                        </div>
                                        <button onClick={() => setLiveErrors(prev => prev.filter(e => e.id !== err.id))} className="text-red-400/60 hover:text-red-300 shrink-0">
                                            <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                    {/* Live router/available_when misconfiguration toasts — a condition that raised
                        (typo'd state key, unsupported syntax) fails open/closed *silently* by
                        design, so this was previously invisible even while watching the live
                        dashboard. Amber, not red: this is a config-authoring issue to fix, not a
                        runtime crash. */}
                    {liveRouterIssues.length > 0 && (
                        <div className="fixed top-20 right-4 z-50 flex flex-col gap-2 w-96 max-w-[90vw]" style={{ marginTop: liveErrors.length > 0 ? `${liveErrors.length * 4 + 4}rem` : 0 }}>
                            {liveRouterIssues.map(issue => (
                                <div key={issue.id} className="bg-amber-950/95 border border-amber-500/50 rounded-lg shadow-xl p-3 backdrop-blur-md animate-[pulse_0.3s_ease-in-out]">
                                    <div className="flex items-start gap-2">
                                        <svg className="w-4 h-4 text-amber-400 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                                        <div className="flex-1 min-w-0">
                                            <div className="text-xs font-bold text-amber-300 uppercase tracking-wide">Condition never fires</div>
                                            <div className="text-xs text-amber-200/90 mt-1 break-words">{issue.description}</div>
                                            <div className="text-xs text-amber-200/70 mt-0.5 break-words">{issue.error}</div>
                                        </div>
                                        <button onClick={() => setLiveRouterIssues(prev => prev.filter(r => r.id !== issue.id))} className="text-amber-400/60 hover:text-amber-300 shrink-0">
                                            <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                    <NavBar
                        onSync={handleManualSync}
                        onSyncBlueprint={handleBlueprintSync}
                        mainTab={mainTab}
                        setMainTab={setMainTab}
                        theme={theme}
                        onToggleTheme={() => {
                            setTheme(prev => {
                                const next = prev === 'light' ? 'dark' : 'light';
                                // Update the ref synchronously so the fetchConfig() call right
                                // below sees the new theme immediately, rather than waiting for
                                // the theme-sync effect to run on the next render.
                                themeRef.current = next;
                                return next;
                            });
                            fetchConfig();
                        }}
                    />

                    {mainTab === 'dashboard' ? (
                        <div className="flex flex-1 overflow-hidden relative">
                            <div className={`${isRightPaneOpen ? 'w-[55%]' : 'w-full'} relative flex flex-col bg-background border-r border-border transition-all duration-300`}>
                                <div className="absolute top-4 left-4 z-10 flex items-center gap-2 bg-surface/80 backdrop-blur px-3 py-1.5 rounded-md border border-border shadow-sm">
                                    <div className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                                    <span className="text-xs font-medium text-neutral-300">Live Architecture</span>
                                </div>

                                <button
                                    onClick={() => setIsRightPaneOpen(!isRightPaneOpen)}
                                    className="absolute top-4 right-4 z-10 p-2 bg-surface/80 hover:bg-surface backdrop-blur rounded-md border border-border shadow-sm text-neutral-400 hover:text-neutral-100 transition-colors"
                                    title={isRightPaneOpen ? "Expand ReactFlow" : "Show Traces Pane"}
                                >
                                    {isRightPaneOpen ? (
                                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" /></svg>
                                    ) : (
                                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
                                    )}
                                </button>

                                <div
                                    className={`absolute z-20 bottom-0 right-10 bg-surface backdrop-blur-xl border border-border shadow-2xl flex flex-col overflow-hidden transition-all duration-300 rounded-t-xl w-[440px] max-w-[92vw] ${isChatExpanded ? 'h-[70vh]' : 'h-12'}`}
                                >
                                    <div
                                        onClick={() => setIsChatExpanded(!isChatExpanded)}
                                        className="h-12 px-4 bg-primary/10 hover:bg-primary/20 border-b border-border flex justify-between items-center cursor-pointer transition-colors"
                                    >
                                        <div className="flex items-center gap-2">
                                            <div className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                                            <span className="font-semibold text-sm text-neutral-100">IntaGrin Architect</span>
                                        </div>
                                        <div className="flex items-center gap-3">
                                            {isChatExpanded && (
                                                <button
                                                    onClick={(e) => { e.stopPropagation(); updateArchitectMessages([]); }}
                                                    className="text-xs text-neutral-400 hover:text-neutral-100"
                                                >
                                                    Clear
                                                </button>
                                            )}
                                            <svg className={`w-4 h-4 text-neutral-400 transform transition-transform ${isChatExpanded ? 'rotate-180' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 15l7-7 7 7" />
                                            </svg>
                                        </div>
                                    </div>

                                    <div ref={architectScrollRef} className={`flex-1 overflow-y-auto p-4 space-y-4 bg-background/50 ${!isChatExpanded ? 'hidden' : ''}`}>
                                        {architectMessages.map((msg, idx) => (
                                            <div key={idx} className={`flex flex-col ${msg.role === 'user' ? 'items-end' : 'items-start'}`}>
                                                <div
                                                    className={`max-w-[85%] rounded-2xl px-4 py-2 text-sm prose prose-invert prose-sm ${msg.role === 'user' ? 'bg-primary text-white rounded-br-none' : 'bg-white/10 text-neutral-200 rounded-bl-none'}`}
                                                    dangerouslySetInnerHTML={{ __html: msg.role === 'assistant' && typeof marked !== 'undefined' ? marked.parse(msg.content || "") : msg.content }}
                                                />

                                                {/* Approval UI */}
                                                {msg.proposed_changes && msg.proposed_changes.files_to_write && msg.proposed_changes.files_to_write.length > 0 && (
                                                    <div className="mt-2 p-3 bg-neutral-900 border border-neutral-700 rounded-xl w-[85%]">
                                                        <div className="text-xs text-neutral-400 mb-2 font-semibold">PROPOSED CHANGES</div>
                                                        <div className="flex flex-wrap gap-2">
                                                            {msg.proposed_changes.files_to_write.map(f => (
                                                                <span key={f.filepath} className="px-2 py-1 bg-neutral-800 rounded text-xs text-blue-400">
                                                                    {f.filepath}
                                                                </span>
                                                            ))}
                                                        </div>
                                                        {msg.applied ? (
                                                            <div className="mt-3 text-xs text-green-400 font-bold flex items-center gap-1">
                                                                <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>
                                                                Changes Applied
                                                            </div>
                                                        ) : (
                                                            <button
                                                                className="mt-3 w-full py-1.5 bg-primary hover:bg-indigo-500 rounded text-xs text-white font-bold transition-colors"
                                                                onClick={async () => {
                                                                    try {
                                                                        const res = await fetch('/api/architect/apply', {
                                                                            method: 'POST',
                                                                            headers: { 'Content-Type': 'application/json' },
                                                                            body: JSON.stringify(msg.proposed_changes)
                                                                        });
                                                                        if (res.ok) {
                                                                            const newMsgs = [...architectMessages];
                                                                            newMsgs[idx].applied = true;
                                                                            updateArchitectMessages(newMsgs);
                                                                            fetchConfig();
                                                                        }
                                                                    } catch (e) {
                                                                        alert("Failed to apply changes");
                                                                    }
                                                                }}
                                                            >
                                                                Approve & Apply
                                                            </button>
                                                        )}
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                        {isArchitectTyping && (
                                            <div className="flex justify-start">
                                                <div className="bg-white/10 text-neutral-400 rounded-2xl rounded-bl-none px-4 py-2 text-sm animate-pulse flex items-center gap-2">
                                                    <div className="w-1.5 h-1.5 bg-neutral-400 rounded-full animate-bounce" style={{ animationDelay: '0s' }}></div>
                                                    <div className="w-1.5 h-1.5 bg-neutral-400 rounded-full animate-bounce" style={{ animationDelay: '0.2s' }}></div>
                                                    <div className="w-1.5 h-1.5 bg-neutral-400 rounded-full animate-bounce" style={{ animationDelay: '0.4s' }}></div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                    <div className={`p-3 border-t border-border bg-background/50 flex gap-2 items-center ${!isChatExpanded ? 'hidden' : ''}`}>
                                        <select
                                            className="flex-shrink-0 max-w-[110px] bg-surface border border-border rounded-lg px-2 py-1.5 text-xs text-neutral-100 focus:outline-none focus:border-primary"
                                            value={activeArchSessionId}
                                            onChange={(e) => {
                                                if (e.target.value === 'new') createNewArchSession();
                                                else setActiveArchSessionId(e.target.value);
                                            }}
                                        >
                                            {architectSessions.map(s => (
                                                <option key={s.id} value={s.id}>{s.name}</option>
                                            ))}
                                            <option value="new">+ New Session</option>
                                        </select>
                                        <input
                                            type="text"
                                            className="flex-1 min-w-0 bg-surface border border-border rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-primary text-neutral-100 placeholder-neutral-500"
                                            placeholder="Tell Architect to modify agents, tools, or routing..."
                                            onKeyDown={async (e) => {
                                                if (e.key === 'Enter' && e.target.value.trim()) {
                                                    const val = e.target.value;
                                                    e.target.value = '';
                                                    const newMsgs = [...architectMessages, { role: 'user', content: val }];
                                                    updateArchitectMessages(newMsgs);
                                                    setIsArchitectTyping(true);
                                                    try {
                                                        const res = await fetch('/api/architect', {
                                                            method: 'POST',
                                                            headers: { 'Content-Type': 'application/json' },
                                                            body: JSON.stringify({ messages: newMsgs.map(m => ({ role: m.role, content: m.content || "" })) })
                                                        });
                                                        if (res.ok) {
                                                            const data = await res.json();
                                                            updateArchitectMessages([...newMsgs, {
                                                                role: 'assistant',
                                                                content: data.message || "Done.",
                                                                proposed_changes: data
                                                            }]);
                                                        } else {
                                                            let errorText = "Unknown Server Error";
                                                            try {
                                                                const err = await res.json();
                                                                if (typeof err.detail === 'string') errorText = err.detail;
                                                                else if (Array.isArray(err.detail)) errorText = err.detail.map(e => e.msg).join(', ');
                                                            } catch (e) {
                                                                errorText = "Failed to parse error response.";
                                                            }
                                                            updateArchitectMessages([...newMsgs, { role: 'assistant', content: "Error: " + errorText }]);
                                                        }
                                                    } catch (err) {
                                                        updateArchitectMessages([...newMsgs, { role: 'assistant', content: "Network error connecting to Architect." }]);
                                                    } finally {
                                                        setIsArchitectTyping(false);
                                                    }
                                                }
                                            }}
                                        />
                                        <div className="flex-shrink-0 whitespace-nowrap text-[10px] text-neutral-400 font-bold uppercase tracking-wider pr-1">Press Enter</div>
                                    </div>
                                </div>


                                <ReactFlow
                                    nodes={displayNodes}
                                    edges={displayEdges}
                                    onNodesChange={onNodesChange}
                                    onEdgesChange={onEdgesChange}
                                    onNodeDragStop={onNodeDragStop}
                                    onConnect={onConnect}
                                    onEdgesDelete={onEdgesDelete}
                                    onNodesDelete={onNodesDelete}
                                    fitView
                                >
                                    <Background color={theme === 'light' ? '#e5e5e5' : '#262626'} gap={20} size={1.5} />
                                    <Controls />
                                </ReactFlow>
                            </div>

                            {isRightPaneOpen && (
                                <div className="w-[45%] flex flex-col bg-surface/30">
                                    <div className="px-4 pt-3 border-b border-border bg-surface/50 backdrop-blur-sm flex gap-6">
                                        <button onClick={() => setRightTab('traces')} className={`text-sm font-semibold pb-3 border-b-2 transition-colors ${rightTab === 'traces' ? 'border-primary text-primary' : 'border-transparent text-neutral-500 hover:text-neutral-300'}`}>Execution Traces</button>
                                        <button onClick={() => setRightTab('playground')} className={`text-sm font-semibold pb-3 border-b-2 transition-colors ${rightTab === 'playground' ? 'border-primary text-primary' : 'border-transparent text-neutral-500 hover:text-neutral-300'}`}>Agent Playground</button>
                                    </div>

                                    <div className="flex-1 overflow-hidden relative">
                                        {rightTab === 'playground' ? (
                                            <Playground fetchMemory={fetchMemory} messages={playgroundMessages} setMessages={setPlaygroundMessages} streamingAgent={streamingAgent} setStreamingAgent={setStreamingAgent} sessions={sessions} activeSessionId={activeSessionId} setActiveSessionId={setActiveSessionId} contextWindow={contextWindow} />
                                        ) : (
                                            <div className="flex h-full overflow-hidden">
                                                {/* Sidebar */}
                                                <div className="w-1/3 border-r border-border bg-surface/20 overflow-y-auto flex flex-col">
                                                    <div className="px-4 py-3 border-b border-border text-xs font-semibold text-neutral-400 uppercase tracking-wider sticky top-0 bg-surface/90 backdrop-blur z-10">
                                                        Session History
                                                    </div>
                                                    {sessions.length === 0 ? (
                                                        <div className="p-4 text-xs text-neutral-500 text-center">No active sessions.</div>
                                                    ) : (
                                                        sessions.map(s => {
                                                            // Surface which sessions need attention without opening each one —
                                                            // previously the sidebar gave zero signal about problem sessions.
                                                            const hasToolError = (s.messages || []).some(m => m.role === 'tool' && /error|failed/i.test(String(m.content || '')));
                                                            const hasPendingApproval = !!s.state?._pending_approval;
                                                            return (
                                                                <button
                                                                    key={s.session_id}
                                                                    onClick={() => setActiveTraceId(s.session_id)}
                                                                    className={`text-left px-4 py-3 border-b border-border/50 hover:bg-surface transition-colors ${activeTraceId === s.session_id ? 'bg-primary/10 border-l-2 border-l-primary' : 'border-l-2 border-l-transparent'}`}
                                                                >
                                                                    <div className="flex items-center gap-1.5 mb-1">
                                                                        <div className="text-xs font-mono text-neutral-300 truncate" title={s.session_id}>{s.session_id}</div>
                                                                        {hasToolError && <span title="Contains a failed tool call" className="shrink-0 w-1.5 h-1.5 rounded-full bg-red-500"></span>}
                                                                        {hasPendingApproval && <span title="Awaiting human approval" className="shrink-0 w-1.5 h-1.5 rounded-full bg-amber-400"></span>}
                                                                    </div>
                                                                    <div className="flex justify-between items-center text-[10px] text-neutral-500">
                                                                        <span>{s.messages?.length || 0} msgs</span>
                                                                        {s.state?._metrics && <span>${(s.state._metrics.total_cost || 0).toFixed(4)}</span>}
                                                                    </div>
                                                                </button>
                                                            );
                                                        })
                                                    )}
                                                </div>

                                                {/* Main Content */}
                                                <div className="w-2/3 h-full overflow-y-auto p-4 bg-background/50">
                                                    {sessions.length === 0 ? (
                                                        <div className="flex flex-col items-center justify-center h-full text-neutral-500">
                                                            <svg className="w-12 h-12 mb-4 opacity-20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1} d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4" />
                                                            </svg>
                                                            <p className="text-sm">No active sessions found.</p>
                                                        </div>
                                                    ) : (
                                                        activeTraceId && sessions.find(s => s.session_id === activeTraceId) ? (
                                                            <SessionCard
                                                                session={sessions.find(s => s.session_id === activeTraceId)}
                                                                onContinueChat={handleContinueChat}
                                                            />
                                                        ) : (
                                                            <div className="flex items-center justify-center h-full text-neutral-500 text-sm">
                                                                Select a session from the sidebar to view its trace.
                                                            </div>
                                                        )
                                                    )}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    ) : mainTab === 'logs' ? (
                        <LogsView />
                    ) : (
                        <DocsViewer />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Monitor />);
    </script>{% endraw %}
</body>

</html>
