<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntaGrin Monitor</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        // RGB-triplet form (not a bare hex) so Tailwind's opacity modifiers
                        // (bg-primary/10, border-border/50, etc.) keep working — the values
                        // themselves live in CSS variables (see the <style> block) so a single
                        // theme toggle repaints every utility class built from these tokens.
                        background: 'rgb(var(--color-background-rgb) / <alpha-value>)',
                        surface: 'rgb(var(--color-surface-rgb) / <alpha-value>)',
                        border: 'rgb(var(--color-border-rgb) / <alpha-value>)',
                        primary: 'rgb(var(--color-primary-rgb) / <alpha-value>)',
                        white: 'rgb(var(--color-white-rgb) / <alpha-value>)',
                        neutral: {
                            100: 'var(--n100)',
                            200: 'var(--n200)',
                            300: 'var(--n300)',
                            400: 'var(--n400)',
                            500: 'var(--n500)',
                            600: 'var(--n600)',
                            700: 'var(--n700)',
                            800: 'var(--n800)',
                            900: 'var(--n900)',
                        },
                    }
                }
            }
        }
    </script>

    <!-- React & React Flow -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/reactflow@11.10.1/dist/umd/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/reactflow@11.10.1/dist/style.css" />

    <style>
        /* Theme tokens. :root carries the dark palette (today's only look) as the default so the
           page never flashes unstyled before React/the theme effect run; .light overrides them.
           Every Tailwind color in tailwind.config, plus the plain-CSS rules below, resolve
           through these — toggling theme is exactly this one variable swap, nothing else. */
        :root {
            --color-background-rgb: 10 10 10;
            --color-surface-rgb: 23 23 23;
            --color-border-rgb: 38 38 38;
            --color-primary-rgb: 99 102 241;
            --color-white-rgb: 255 255 255;
            --n100: #f5f5f5;
            --n200: #e5e5e5;
            --n300: #d4d4d4;
            --n400: #a3a3a3;
            --n500: #737373;
            --n600: #525252;
            --n700: #404040;
            --n800: #262626;
            --n900: #171717;
            --scrollbar-thumb: #3f3f46;
            --scrollbar-thumb-hover: #52525b;
        }

        :root.light {
            --color-background-rgb: 250 250 250;
            --color-surface-rgb: 255 255 255;
            --color-border-rgb: 229 229 229;
            --color-primary-rgb: 79 70 229;
            --color-white-rgb: 0 0 0;
            --n100: #171717;
            --n200: #262626;
            --n300: #404040;
            --n400: #525252;
            --n500: #737373;
            --n600: #a3a3a3;
            --n700: #d4d4d4;
            --n800: #e5e5e5;
            --n900: #f5f5f5;
            --scrollbar-thumb: #d4d4d4;
            --scrollbar-thumb-hover: #a3a3a3;
        }

        body {
            background-color: rgb(var(--color-background-rgb));
            color: var(--n100);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }

        /* React Flow Theme Overrides */
        .react-flow__node {
            border-radius: 8px;
            border: 1px solid rgb(var(--color-border-rgb));
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .react-flow__controls {
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgb(var(--color-border-rgb));
        }

        .react-flow__controls button {
            background: rgb(var(--color-surface-rgb));
            border-bottom: 1px solid rgb(var(--color-border-rgb));
            fill: var(--n400);
        }

        .react-flow__controls button:hover {
            background: rgb(var(--color-border-rgb));
        }

        .react-flow__handle {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgb(var(--color-primary-rgb));
            border: 2px solid rgb(var(--color-surface-rgb));
            cursor: crosshair;
            transition: all 0.2s;
        }

        .react-flow__handle:hover {
            transform: scale(1.3);
            background: #10b981;
        }

        /* Markdown Prose Styles */
        .prose h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--n100);
        }

        .prose h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            color: var(--n200);
        }

        .prose h3 {
            font-size: 1.125rem;
            font-weight: 600;
            margin-top: 1.25rem;
            margin-bottom: 0.5rem;
            color: var(--n300);
        }

        .prose p {
            margin-bottom: 1rem;
            color: var(--n400);
            line-height: 1.6;
        }

        .prose pre {
            background: rgb(var(--color-surface-rgb));
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin-bottom: 1rem;
            border: 1px solid rgb(var(--color-border-rgb));
        }

        .prose code {
            color: rgb(var(--color-primary-rgb));
            font-family: monospace;
            font-size: 0.875rem;
        }

        .prose a {
            color: rgb(var(--color-primary-rgb));
            text-decoration: underline;
        }

        .prose ul {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
            color: var(--n400);
        }

        .prose li {
            margin-bottom: 0.25rem;
        }

        .prose blockquote {
            border-left: 4px solid var(--scrollbar-thumb);
            padding-left: 1rem;
            color: var(--n400);
            font-style: italic;
        }
    </style>
</head>

<body class="antialiased h-screen overflow-hidden flex flex-col">
    <div id="root" class="flex flex-col h-full"></div>

    <script>
        window.LOGO_DATA_URI = "{{ logo_data_uri }}";
        window.LOGO_DATA_URI_LIGHT = "{{ logo_data_uri_light }}";
    </script>
    {% raw %}
    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;
        const { ReactFlow, Controls, Background, applyNodeChanges, applyEdgeChanges, MarkerType, addEdge } = window.ReactFlow;

        const Badge = ({ children, color = 'blue' }) => {
            const colors = {
                blue: 'bg-blue-500/10 text-blue-400 ring-blue-500/20',
                green: 'bg-emerald-500/10 text-emerald-400 ring-emerald-500/20',
                purple: 'bg-purple-500/10 text-purple-400 ring-purple-500/20',
                amber: 'bg-amber-500/10 text-amber-400 ring-amber-500/20',
            };
            return <span className={`inline-flex items-center px-2 py-0.5 rounded text-xs font-medium ring-1 ring-inset ${colors[color]}`}>{children}</span>;
        };

        const NavBar = ({ onSync, onSyncBlueprint, mainTab, setMainTab, theme, onToggleTheme }) => (
            <header className="h-16 border-b border-border bg-surface/50 backdrop-blur-md flex items-center justify-between px-6 shrink-0 z-10 relative">
                <div className="flex items-center gap-6">
                    <div className="flex items-center gap-3">
                        <img
                            src={theme === 'light' && window.LOGO_DATA_URI_LIGHT ? window.LOGO_DATA_URI_LIGHT : window.LOGO_DATA_URI}
                            alt="IntaGrin Logo"
                            className="h-9 max-w-[180px] object-contain"
                        />
                        <h1 className="text-lg font-semibold tracking-tight"><span className="text-neutral-500 font-normal ml-2">Monitor</span></h1>
                    </div>

                    <div className="flex items-center gap-1 ml-6 border-l border-border pl-6">
                        <button onClick={() => setMainTab('dashboard')} className={`px-4 py-1.5 rounded-md text-sm font-medium transition-colors ${mainTab === 'dashboard' ? 'bg-primary/10 text-primary' : 'text-neutral-400 hover:text-neutral-200 hover:bg-white/5'}`}>Dashboard</button>
                        <button onClick={() => setMainTab('logs')} className={`px-4 py-1.5 rounded-md text-sm font-medium transition-colors ${mainTab === 'logs' ? 'bg-primary/10 text-primary' : 'text-neutral-400 hover:text-neutral-200 hover:bg-white/5'}`}>Logs</button>
                        <button onClick={() => setMainTab('docs')} className={`px-4 py-1.5 rounded-md text-sm font-medium transition-colors ${mainTab === 'docs' ? 'bg-primary/10 text-primary' : 'text-neutral-400 hover:text-neutral-200 hover:bg-white/5'}`}>Documentation</button>
                    </div>
                </div>

                <div className="flex items-center gap-3">
                    <button
                        onClick={onToggleTheme}
                        title={theme === 'light' ? 'Switch to dark mode' : 'Switch to light mode'}
                        className="p-2 rounded-lg border border-border text-neutral-400 hover:text-neutral-200 hover:bg-white/5 transition-all duration-200"
                    >
                        {theme === 'light' ? (
                            <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                            </svg>
                        ) : (
                            <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                            </svg>
                        )}
                    </button>
                    <button
                        onClick={onSyncBlueprint}
                        className="flex items-center gap-2 px-4 py-2 bg-primary/10 hover:bg-primary/20 text-primary text-sm font-medium rounded-lg border border-primary/20 transition-all duration-200"
                    >
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
                        </svg>
                        Push Graph to Blueprint
                    </button>
                    <button
                        onClick={onSync}
                        className="flex items-center gap-2 px-4 py-2 bg-white/5 hover:bg-white/10 text-sm font-medium rounded-lg border border-white/10 transition-all duration-200"
                    >
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                        Sync State
                    </button>
                </div>
            </header>
        );

        const SessionCard = ({ session, onContinueChat }) => {
            const [activeTab, setActiveTab] = useState('trace');

            return (
                <div className="bg-surface border border-border rounded-xl overflow-hidden shadow-sm">
                    <div className="px-4 py-3 border-b border-border bg-white/[0.02] flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <span className="text-xs font-medium text-neutral-400">Session ID:</span>
                            <code className="text-xs text-primary font-mono bg-primary/10 px-1.5 py-0.5 rounded">{session.session_id}</code>
                        </div>
                        <div className="flex items-center gap-2">
                            {session.state?._metrics && (
                                <>
                                    <div className="text-[10px] bg-blue-500/10 text-blue-400 px-2 py-0.5 rounded border border-blue-500/20">{(session.state._metrics.total_tokens).toLocaleString()} Tokens</div>
                                    <div className="text-[10px] bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/20">${(session.state._metrics.total_cost).toFixed(5)}</div>
                                </>
                            )}
                            {onContinueChat && (
                                <button onClick={() => onContinueChat(session.session_id)} className="px-3 py-1 text-[10px] font-bold uppercase tracking-wider bg-primary/20 text-primary rounded hover:bg-primary/30 transition-colors border border-primary/30 ml-2">
                                    Chat
                                </button>
                            )}
                        </div>
                    </div>

                    <div className="border-b border-border bg-surface flex text-sm">
                        <button onClick={() => setActiveTab('trace')} className={`flex-1 py-2.5 text-center text-xs font-semibold tracking-wide uppercase transition-colors border-b-2 ${activeTab === 'trace' ? 'border-primary text-primary' : 'border-transparent text-neutral-500 hover:text-neutral-300'}`}>Trace Timeline</button>
                        <button onClick={() => setActiveTab('state')} className={`flex-1 py-2.5 text-center text-xs font-semibold tracking-wide uppercase transition-colors border-b-2 ${activeTab === 'state' ? 'border-amber-400 text-amber-400' : 'border-transparent text-neutral-500 hover:text-neutral-300'}`}>Global State</button>
                        <button onClick={() => setActiveTab('debug')} className={`flex-1 py-2.5 text-center text-xs font-semibold tracking-wide uppercase transition-colors border-b-2 ${activeTab === 'debug' ? 'border-purple-400 text-purple-400' : 'border-transparent text-neutral-500 hover:text-neutral-300'}`}>Raw Debug</button>
                    </div>

                    <div className="p-4">
                        {activeTab === 'state' && (
                            <div className="bg-background border border-border rounded-lg p-3 overflow-x-auto max-h-[400px]">
                                <pre className="text-[11px] text-amber-300 font-mono">{JSON.stringify(session.state, null, 2)}</pre>
                            </div>
                        )}

                        {activeTab === 'debug' && (
                            <div className="bg-background border border-border rounded-lg p-3 overflow-x-auto max-h-[400px]">
                                <pre className="text-[11px] text-purple-300 font-mono">{JSON.stringify(session.messages, null, 2)}</pre>
                            </div>
                        )}

                        {activeTab === 'trace' && (
                            <div className="space-y-3">
                                {session.messages.map((msg, i) => {
                                    if (msg.role === 'user') {
                                        return (
                                            <div key={i} className="flex gap-3">
                                                <div className="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center shrink-0 text-xs font-bold">U</div>
                                                <div className="bg-emerald-500/10 border border-emerald-500/20 rounded-lg p-3 text-sm text-neutral-200 flex-1">{msg.content}</div>
                                            </div>
                                        );
                                    }
                                    if (msg.role === 'assistant') {
                                        return (
                                            <div key={i} className="flex gap-3">
                                                <div className="w-6 h-6 rounded-full bg-purple-500/20 text-purple-400 flex items-center justify-center shrink-0 text-xs font-bold">A</div>
                                                <div className="flex-1 space-y-2">
                                                    {msg.content && (
                                                        <div
                                                            className="text-sm text-neutral-300 bg-white/5 rounded-lg p-3 border border-border prose prose-invert prose-sm max-w-none"
                                                            dangerouslySetInnerHTML={{
                                                                __html: typeof marked !== 'undefined' ? marked.parse(msg.content) : msg.content
                                                            }}
                                                        />
                                                    )}
                                                    {msg.tool_calls && msg.tool_calls.map((tc, j) => (
                                                        <div key={j} className="bg-surface border border-border rounded-lg p-2.5 flex flex-col gap-1.5 shadow-sm">
                                                            <div className="flex items-center gap-2">
                                                                <svg className="w-3.5 h-3.5 text-neutral-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                                                                <span className="text-xs font-medium text-neutral-300">Action: {tc.function.name}</span>
                                                            </div>
                                                            <code className="text-[11px] text-neutral-400 bg-background p-1.5 rounded break-all">{tc.function.arguments}</code>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        );
                                    }
                                    if (msg.role === 'tool') {
                                        // Tool errors previously rendered identically to successful tool
                                        // output (same amber styling) — no visual signal that something failed.
                                        const isError = /error|failed/i.test(String(msg.content || ''));
                                        return (
                                            <div key={i} className="flex gap-3 pl-9">
                                                <div className={`flex-1 rounded-lg p-2.5 flex flex-col gap-1 text-sm shadow-sm border ${isError ? 'bg-red-500/10 border-red-500/30' : 'bg-amber-500/5 border-amber-500/20'}`}>
                                                    <span className={`text-[10px] uppercase font-bold tracking-wider ${isError ? 'text-red-400' : 'text-amber-500'}`}>
                                                        {isError ? `✗ Failed: ${msg.name}` : `Result from ${msg.name}`}
                                                    </span>
                                                    <code className={`text-xs break-words ${isError ? 'text-red-200/90' : 'text-amber-200/80'}`}>{(msg.content || '').substring(0, 500)}{msg.content?.length > 500 ? '...' : ''}</code>
                                                </div>
                                            </div>
                                        );
                                    }
                                    if (msg.role === 'system') {
                                        const text = String(msg.content || '');
                                        const isHandoff = text.startsWith('Router: Transferred to') || text.startsWith('Semantic Swarm Router:');
                                        if (!isHandoff) return null; // other system messages (prompt injection, etc.) stay out of the timeline noise
                                        return (
                                            <div key={i} className="flex gap-3 pl-9">
                                                <div className="flex items-center gap-2 text-xs text-cyan-300 bg-cyan-500/10 border border-cyan-500/20 rounded-lg px-3 py-1.5">
                                                    <svg className="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 8l4 4m0 0l-4 4m4-4H3" /></svg>
                                                    {text}
                                                </div>
                                            </div>
                                        );
                                    }
                                    return null;
                                })}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // Searchable session picker for the Playground — replaces the old free-text session_id
        // input, which made it impossible to see or reuse an existing session without already
        // knowing its exact id. Still allows typing an arbitrary id (e.g. one created by an
        // external system), via the "Use" row when the search text matches nothing.
        const SessionSelector = ({ sessions, activeSessionId, onSelect }) => {
            const [open, setOpen] = useState(false);
            const [query, setQuery] = useState('');
            const containerRef = useRef(null);
            const inputRef = useRef(null);

            useEffect(() => {
                if (!open) return;
                const handleClickOutside = (e) => {
                    if (containerRef.current && !containerRef.current.contains(e.target)) {
                        setOpen(false);
                    }
                };
                const handleEscape = (e) => {
                    if (e.key === 'Escape') setOpen(false);
                };
                document.addEventListener('mousedown', handleClickOutside);
                document.addEventListener('keydown', handleEscape);
                return () => {
                    document.removeEventListener('mousedown', handleClickOutside);
                    document.removeEventListener('keydown', handleEscape);
                };
            }, [open]);

            useEffect(() => {
                if (open) {
                    setQuery('');
                    setTimeout(() => inputRef.current?.focus(), 0);
                }
            }, [open]);

            const q = query.trim().toLowerCase();
            const filtered = (sessions || [])
                .filter(s => !q || s.session_id.toLowerCase().includes(q))
                .sort((a, b) => (b.messages?.length || 0) - (a.messages?.length || 0));
            const exactMatch = (sessions || []).some(s => s.session_id === query.trim());

            const select = (id) => {
                onSelect(id);
                setOpen(false);
            };

            return (
                <div className="relative" ref={containerRef}>
                    <button
                        type="button"
                        onClick={() => setOpen(o => !o)}
                        className="flex items-center gap-1.5 bg-background border border-border rounded px-2 py-1 text-xs text-primary font-mono focus:outline-none focus:border-primary shadow-inner hover:border-primary/60 transition-colors max-w-[220px]"
                        title={activeSessionId}
                    >
                        <span className="truncate">{activeSessionId || 'Select a session...'}</span>
                        <svg className="w-3 h-3 shrink-0 text-neutral-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" /></svg>
                    </button>

                    {open && (
                        <div className="absolute top-full left-0 mt-1 w-72 bg-surface border border-border rounded-lg shadow-xl z-30 overflow-hidden">
                            <div className="p-2 border-b border-border">
                                <input
                                    ref={inputRef}
                                    type="text"
                                    value={query}
                                    onChange={(e) => setQuery(e.target.value)}
                                    placeholder="Search sessions..."
                                    className="w-full bg-background border border-border rounded px-2 py-1 text-xs text-neutral-200 font-mono focus:outline-none focus:border-primary"
                                />
                            </div>
                            <div className="max-h-64 overflow-y-auto">
                                {filtered.length === 0 ? (
                                    <div className="px-3 py-3 text-xs text-neutral-500 text-center">No matching sessions.</div>
                                ) : (
                                    filtered.map(s => {
                                        const hasPendingApproval = !!s.state?._pending_approval;
                                        const hasToolError = (s.messages || []).some(m => m.role === 'tool' && /error|failed/i.test(String(m.content || '')));
                                        return (
                                            <button
                                                key={s.session_id}
                                                type="button"
                                                onClick={() => select(s.session_id)}
                                                className={`w-full text-left px-3 py-2 border-b border-border/40 last:border-b-0 hover:bg-white/5 transition-colors ${s.session_id === activeSessionId ? 'bg-primary/10' : ''}`}
                                            >
                                                <div className="flex items-center gap-1.5">
                                                    <div className="text-xs font-mono text-neutral-200 truncate flex-1">{s.session_id}</div>
                                                    {hasToolError && <span title="Contains a failed tool call" className="shrink-0 w-1.5 h-1.5 rounded-full bg-red-500"></span>}
                                                    {hasPendingApproval && <span title="Awaiting human approval" className="shrink-0 w-1.5 h-1.5 rounded-full bg-amber-400"></span>}
                                                </div>
                                                <div className="flex justify-between items-center text-[10px] text-neutral-500 mt-0.5">
                                                    <span>{s.messages?.length || 0} msgs</span>
                                                    {s.state?._metrics && <span>${(s.state._metrics.total_cost || 0).toFixed(4)}</span>}
                                                </div>
                                            </button>
                                        );
                                    })
                                )}
                            </div>
                            {query.trim() && !exactMatch && (
                                <button
                                    type="button"
                                    onClick={() => select(query.trim())}
                                    className="w-full text-left px-3 py-2 border-t border-border text-xs text-primary hover:bg-white/5 transition-colors"
                                >
                                    Use "<span className="font-mono">{query.trim()}</span>" as session ID
                                </button>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const Playground = ({ fetchMemory, messages, setMessages, streamingAgent, setStreamingAgent, sessions, activeSessionId, setActiveSessionId, contextWindow }) => {
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const playgroundSession = (sessions || []).find(s => s.session_id === activeSessionId);

            // Chat-window view of `messages` — excludes tool/system plumbing and content-less
            // tool_calls-only assistant turns (see the comment at the render site below).
            const visibleMessages = messages.filter(
                m => m.role === 'user' || (m.role === 'assistant' && m.content)
            );

            const playgroundScrollRef = useRef(null);
            useEffect(() => {
                const el = playgroundScrollRef.current;
                if (!el) return;
                // requestAnimationFrame, not a same-tick assignment — see the identical comment on
                // the Architect chat's scroll effect for why (matters most when this container has
                // just become visible, e.g. right after switching sessions).
                requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
                // Also keyed on the last message's own content (not just the message count) so a
                // reply that streams in gradually keeps auto-scrolling as it grows, not just once
                // when the placeholder bubble is first created.
            }, [visibleMessages.length, loading, visibleMessages[visibleMessages.length - 1]?.content]);

            const sendMessage = async (e, overrideMsg = null) => {
                if (e) e.preventDefault();
                
                const userMsg = overrideMsg !== null ? overrideMsg : input;
                if (!userMsg.trim() || loading) return;

                setInput('');
                setLoading(true);
                
                const newMessages = [...messages, { role: 'user', content: userMsg }];
                setMessages(newMessages);

                try {
                    const response = await fetch('/api/stream', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: userMsg, session_id: activeSessionId })
                    });

                    if (!response.ok) {
                        const err = await response.json();
                        setMessages(prev => [...prev, { role: 'assistant', content: "Error: " + (err.detail || "Unknown error"), isError: true }]);
                        setLoading(false);
                        return;
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();

                    setMessages(prev => [...prev, { role: 'assistant', content: '', agent: '' }]);

                    let buffer = '';
                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop() || '';

                        for (const line of lines) {
                            if (line.startsWith('data: ') && !line.includes('[DONE]')) {
                                try {
                                    const data = JSON.parse(line.slice(6));
                                    if (data.type === 'agent') {
                                        setStreamingAgent(data.agent);
                                        setMessages(prev => {
                                            const newMsgs = [...prev];
                                            const lastIdx = newMsgs.length - 1;
                                            if (newMsgs[lastIdx].role === 'assistant') {
                                                newMsgs[lastIdx] = { ...newMsgs[lastIdx], agent: data.agent };
                                            }
                                            return newMsgs;
                                        });
                                    } else if (data.type === 'content' || data.type === 'status') {
                                        setMessages(prev => {
                                            const newMsgs = [...prev];
                                            const lastIdx = newMsgs.length - 1;
                                            newMsgs[lastIdx] = { ...newMsgs[lastIdx], content: (newMsgs[lastIdx].content || '') + (data.content || '') };
                                            return newMsgs;
                                        });
                                    } else if (data.type === 'error') {
                                        // Backend SSE error events were previously silently dropped here —
                                        // the UI would look stuck "loading" forever with no explanation.
                                        setMessages(prev => {
                                            const newMsgs = [...prev];
                                            const lastIdx = newMsgs.length - 1;
                                            newMsgs[lastIdx] = { ...newMsgs[lastIdx], content: (newMsgs[lastIdx].content || '') + '\n\n**Error:** ' + (data.content || 'Unknown error'), isError: true };
                                            return newMsgs;
                                        });
                                    }
                                } catch (e) {
                                    // Ignore parse errors on incomplete chunks
                                }
                            }
                        }
                    }
                    fetchMemory();
                } catch (e) {
                    setMessages(prev => [...prev, { role: 'assistant', content: "Network error: " + e.message }]);
                }
                setLoading(false);
                setTimeout(() => setStreamingAgent(null), 2000);
            };

            return (
                <div className="flex flex-col h-full relative">
                    <div className="px-4 py-2 bg-surface/90 border-b border-border flex justify-between items-center absolute top-0 left-0 w-full z-20 backdrop-blur-md">
                        <div className="flex items-center gap-2">
                            <span className="text-xs text-neutral-400 font-semibold tracking-wider uppercase">Active Session</span>
                            <SessionSelector
                                sessions={sessions}
                                activeSessionId={activeSessionId}
                                onSelect={(id) => {
                                    setActiveSessionId(id);
                                    const sess = (sessions || []).find(s => s.session_id === id);
                                    setMessages(sess ? (sess.messages || []) : []);
                                }}
                            />
                        </div>
                        <button
                            onClick={() => {
                                const newId = 'session_' + Math.random().toString(36).substring(2, 9);
                                setActiveSessionId(newId);
                                setMessages([]);
                            }}
                            className="text-[10px] font-bold uppercase tracking-wider bg-white/5 hover:bg-white/10 text-neutral-300 px-3 py-1.5 rounded border border-white/10 transition-colors shadow-sm"
                        >
                            + New Session
                        </button>
                    </div>

                    {/* Thermodynamic HUD */}
                    {playgroundSession && playgroundSession.state?._metrics && (
                        <div className="absolute top-16 right-4 z-10 bg-surface/90 backdrop-blur border border-border shadow-lg rounded-lg p-3 flex flex-col gap-2 min-w-[250px]">
                            <div className="text-[10px] font-bold text-neutral-400 uppercase tracking-wider mb-1">Thermodynamic HUD</div>
                            <div className="flex justify-between items-center text-xs">
                                <span className="text-neutral-300">Burn Rate:</span>
                                <span className="font-mono text-emerald-400 font-medium">${Number(playgroundSession.state._metrics.total_cost || 0).toFixed(5)}</span>
                            </div>
                            <div className="flex justify-between items-center text-xs">
                                <span className="text-neutral-300">Context Window:</span>
                                <span className="font-mono text-blue-400 font-medium">{Number(playgroundSession.state._metrics.total_tokens || 0).toLocaleString()} / {(contextWindow / 1000).toFixed(0)}k</span>
                            </div>
                            <div className="w-full bg-background rounded-full h-1.5 mt-1 border border-neutral-800 overflow-hidden">
                                <div className="bg-emerald-500 h-1.5 rounded-full shadow-[0_0_8px_rgba(16,185,129,0.5)]" style={{ width: `${Math.min((Number(playgroundSession.state._metrics.total_tokens || 0) / (contextWindow || 128000)) * 100, 100)}%` }}></div>
                            </div>
                        </div>
                    )}

                    <div ref={playgroundScrollRef} className="flex-1 overflow-y-auto p-4 space-y-4 pb-20 pt-16">
                        {visibleMessages.length === 0 ? (
                            <div className="h-full flex flex-col items-center justify-center text-neutral-500 text-sm italic">
                                <div>No messages in this session yet.</div>
                                <div className="text-xs text-neutral-600 mt-2">Type a message below to start streaming.</div>
                            </div>
                        ) : (
                            <React.Fragment>
                                {/* This is a conversational view, not the technical trace (see the Execution
                                    Traces tab for that) — raw `tool`/`system` messages, and content-less
                                    assistant turns that only carry tool_calls, were previously rendered here
                                    verbatim, showing the tool's raw JSON result as if it were something the
                                    assistant said. Only actual user/assistant turns belong in the chat window. */}
                                {visibleMessages.map((m, i) => (
                                    <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`max-w-[80%] rounded-xl p-3 ${m.isError ? 'bg-red-500/10 border border-red-500/40 text-red-200 shadow-sm' : m.role === 'user' ? 'bg-primary text-white shadow-md' : 'bg-surface border border-border text-neutral-200 shadow-sm'}`}>
                                            {m.agent && <div className="text-[10px] uppercase font-bold text-primary mb-1 tracking-wider">{m.agent}</div>}
                                            {m.role === 'user' ? (
                                                <div className="text-sm">{m.content}</div>
                                            ) : (
                                                <div
                                                    className="text-sm prose prose-invert prose-sm max-w-none"
                                                    dangerouslySetInnerHTML={{
                                                        __html: typeof marked !== 'undefined' ? marked.parse(String(m.content || '')) : m.content
                                                    }}
                                                />
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </React.Fragment>
                        )}
                        {loading && (
                            <div className="flex justify-start">
                                <div className="bg-surface border border-primary/30 text-neutral-300 rounded-xl p-4 shadow-[0_4px_20px_-5px_rgba(99,102,241,0.15)] flex flex-col gap-3 max-w-[85%] relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-primary to-transparent animate-[pulse_2s_ease-in-out_infinite]"></div>
                                    <div className="text-[10px] uppercase font-bold text-primary tracking-wider">The 'Glass Box' Pipeline</div>
                                    <div className="flex items-center flex-wrap gap-2 text-xs font-mono">
                                        <div className="px-2 py-1 rounded border border-neutral-700 bg-background text-neutral-400">Routing</div>
                                        <span className="text-neutral-600">→</span>
                                        <div className="px-3 py-1 rounded border border-emerald-500/50 bg-emerald-500/10 text-emerald-400 animate-pulse shadow-[0_0_15px_rgba(16,185,129,0.2)]">
                                            {streamingAgent ? `Agent: ${streamingAgent.replace(/_/g, ' ').replace(/\b\\w/g, l => l.toUpperCase())}` : 'Processing...'}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                        {/* Playground Approval UI */}
                        {!loading && sessions?.find(s => s.session_id === activeSessionId)?.state?._pending_approval && (
                            <div className="flex justify-start mt-4 mb-4">
                                <div className="max-w-[80%] rounded-xl p-4 border border-yellow-500/30 bg-yellow-500/10 shadow-lg w-full">
                                    <div className="flex items-center gap-2 mb-2">
                                        <span className="text-lg">⚠️</span>
                                        <h4 className="text-yellow-400 font-bold text-sm tracking-wide uppercase">Approval Required</h4>
                                    </div>
                                    <p className="text-sm text-neutral-300 mb-4">
                                        The agent is requesting permission to execute <span className="font-mono text-yellow-300 bg-yellow-900/50 px-1 rounded">{sessions.find(s => s.session_id === activeSessionId).state._pending_approval.name || sessions.find(s => s.session_id === activeSessionId).state._pending_approval.tool}</span>.
                                    </p>
                                    <div className="flex gap-3">
                                        <button
                                            className="flex-1 py-2 bg-green-600/90 hover:bg-green-500 text-white font-bold rounded shadow transition-colors"
                                            onClick={async () => {
                                                setLoading(true);
                                                try {
                                                    const res = await fetch('/api/resume', {
                                                        method: 'POST',
                                                        headers: { 'Content-Type': 'application/json' },
                                                        body: JSON.stringify({ session_id: activeSessionId, approved: true })
                                                    });
                                                    if (res.ok) {
                                                        // /resume's own turn loop already ran the conversation as far as it could
                                                        // go server-side (executing the approved tool, then continuing — which can
                                                        // mean anything from a final answer to a brand-new itinerary awaiting the
                                                        // human's next decision, or another pause). Show that real response instead
                                                        // of discarding it and blindly sending a canned "Yes, proceed." on top of a
                                                        // transcript that never learned what actually happened — the previous
                                                        // behavior could silently skip straight past content like a freshly
                                                        // researched itinerary that still needed the user's own review.
                                                        const data = await res.json();
                                                        setMessages(prev => [...prev, { role: 'assistant', content: data.response, agent: data.active_agent }]);
                                                    }
                                                } finally {
                                                    setLoading(false);
                                                    fetchMemory();
                                                }
                                            }}
                                        >Approve</button>
                                        <button
                                            className="flex-1 py-2 bg-red-600/90 hover:bg-red-500 text-white font-bold rounded shadow transition-colors"
                                            onClick={async () => {
                                                setLoading(true);
                                                try {
                                                    const res = await fetch('/api/resume', {
                                                        method: 'POST',
                                                        headers: { 'Content-Type': 'application/json' },
                                                        body: JSON.stringify({ session_id: activeSessionId, approved: false, reviewer_notes: "Rejected by user in Playground UI." })
                                                    });
                                                    if (res.ok) {
                                                        // See the identical comment on the Approve handler above.
                                                        const data = await res.json();
                                                        setMessages(prev => [...prev, { role: 'assistant', content: data.response, agent: data.active_agent }]);
                                                    }
                                                } finally {
                                                    setLoading(false);
                                                    fetchMemory();
                                                }
                                            }}
                                        >Reject</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    <div className="p-4 border-t border-border bg-surface/50">
                        <input
                            type="text"
                            value={input}
                            onChange={e => setInput(e.target.value)}
                            onKeyDown={e => e.key === 'Enter' && sendMessage()}
                            className="w-full bg-background border border-border rounded-lg px-4 py-3 text-sm text-neutral-100 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-inner"
                            placeholder="Type a message to test your agents..."
                        />
                    </div>
                </div>
            );
        };

        const DocsViewer = () => {
            const [docs, setDocs] = useState([]);
            const [selectedDoc, setSelectedDoc] = useState(null);

            useEffect(() => {
                fetch('/api/docs').then(r => r.json()).then(d => {
                    const sortedDocs = d.sort((a, b) => a.filename.localeCompare(b.filename));
                    setDocs(sortedDocs);
                    if (sortedDocs.length > 0) setSelectedDoc(sortedDocs[0]);
                }).catch(e => console.error("Docs fetch error:", e));
            }, []);

            const formatDocName = (filename) => {
                return filename.replace(/^[0-9]+_/, '').replace('.md', '').replace(/[-_]/g, ' ');
            };

            if (docs.length === 0) {
                return (
                    <div className="flex flex-col items-center justify-center h-full text-neutral-500 bg-surface/10">
                        <svg className="w-16 h-16 mb-6 text-neutral-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                        </svg>
                        <h3 className="text-lg font-medium text-neutral-300 mb-2">No Documentation Found</h3>
                        <p className="text-sm">Create a <code className="bg-white/10 px-2 py-1 rounded text-primary font-mono">docs/</code> directory in your project root and add markdown files.</p>
                    </div>
                );
            }

            return (
                <div className="flex h-full bg-background w-full">
                    {/* Magical Sidebar */}
                    <div className="w-64 border-r border-border bg-surface/40 flex flex-col backdrop-blur-md relative z-10 shrink-0">
                        <div className="px-5 py-4 border-b border-border/50 flex items-center gap-3 bg-surface/50">
                            <div className="w-8 h-8 rounded-lg bg-primary/20 text-primary flex items-center justify-center shadow-[0_0_15px_-3px_rgba(99,102,241,0.4)]">
                                <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
                            </div>
                            <span className="font-bold text-sm tracking-wide text-neutral-100">Knowledge Base</span>
                        </div>
                        <div className="p-3 flex-1 overflow-y-auto space-y-1">
                            {docs.map(doc => (
                                <button key={doc.filename}
                                    onClick={() => setSelectedDoc(doc)}
                                    className={`w-full text-left px-3 py-2.5 text-sm rounded-lg transition-all duration-200 flex items-center gap-3 group ${selectedDoc?.filename === doc.filename ? 'bg-primary text-white shadow-md shadow-primary/20' : 'text-neutral-400 hover:bg-white/5 hover:text-neutral-200'}`}>
                                    <svg className={`w-4 h-4 shrink-0 transition-colors ${selectedDoc?.filename === doc.filename ? 'text-white' : 'text-neutral-500 group-hover:text-neutral-300'}`} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                                    <span className="truncate capitalize">{formatDocName(doc.filename)}</span>
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Content Area */}
                    <div className="flex-1 flex flex-col h-full bg-background relative overflow-hidden">
                        {/* Glassmorphism Header */}
                        <div className="absolute top-0 left-0 w-full h-14 bg-background/80 backdrop-blur-xl border-b border-border/50 z-10 flex items-center px-8 shadow-sm">
                            <div className="flex items-center gap-2 text-xs font-medium text-neutral-400">
                                <span>Docs</span>
                                <span className="text-neutral-600">/</span>
                                <span className="text-primary capitalize">{selectedDoc ? formatDocName(selectedDoc.filename) : ''}</span>
                            </div>
                        </div>

                        {/* Markdown Body */}
                        <div className="flex-1 overflow-y-auto pt-24 pb-16 px-12 md:px-24">
                            <div className="max-w-4xl mx-auto">
                                <div
                                    className="prose prose-invert prose-sm md:prose-base max-w-none 
                                    prose-headings:text-neutral-100 prose-headings:font-bold prose-h1:text-3xl prose-h1:tracking-tight prose-h1:mb-8
                                    prose-a:text-primary hover:prose-a:text-indigo-400 prose-a:transition-colors
                                    prose-code:text-emerald-400 prose-code:bg-emerald-400/10 prose-code:px-1.5 prose-code:py-0.5 prose-code:rounded-md prose-code:before:content-none prose-code:after:content-none
                                    prose-pre:bg-background prose-pre:border prose-pre:border-white/10 prose-pre:shadow-xl
                                    prose-strong:text-neutral-200 prose-blockquote:border-l-primary prose-blockquote:bg-primary/5 prose-blockquote:py-1 prose-blockquote:px-4 prose-blockquote:rounded-r-lg prose-blockquote:not-italic"
                                    dangerouslySetInnerHTML={{ __html: marked.parse(selectedDoc?.content || "") }}
                                ></div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Debugging view for API-triggered agent runs (/chat, /chat/stream, /resume, /stream) —
        // powered by GET /api/logs (runtime/run_logger.py's run_logs table). Self-contained and
        // self-polling, like DocsViewer above, rather than wired into the dashboard's shared
        // fetchConfig/fetchMemory interval — that interval only does dashboard-relevant work.
        const LogsView = () => {
            const [logs, setLogs] = useState([]);
            const [search, setSearch] = useState('');
            const [loading, setLoading] = useState(true);

            const fetchLogs = () => {
                fetch('/api/logs')
                    .then(r => r.json())
                    .then(data => {
                        if (Array.isArray(data)) {
                            setLogs(data);
                        } else {
                            console.error("Backend Error fetching logs:", data);
                        }
                    })
                    .catch(e => console.error("Logs fetch error:", e))
                    .finally(() => setLoading(false));
            };

            useEffect(() => {
                fetchLogs();
                const interval = setInterval(fetchLogs, 3000);
                return () => clearInterval(interval);
            }, []);

            const q = search.trim().toLowerCase();
            const filtered = !q ? logs : logs.filter(l =>
                [l.session_id, l.endpoint, l.status, l.error].some(
                    v => v && String(v).toLowerCase().includes(q)
                )
            );

            const statusDotClass = (status) => {
                if (status === 'error') return 'bg-red-500';
                if (status === 'awaiting_approval') return 'bg-amber-400';
                return 'bg-emerald-500';
            };

            return (
                <div className="flex flex-col h-full bg-background w-full">
                    <div className="px-6 py-4 border-b border-border flex items-center justify-between shrink-0">
                        <div>
                            <h2 className="text-sm font-bold text-neutral-200 uppercase tracking-wider">API Run Logs</h2>
                            <p className="text-xs text-neutral-500 mt-0.5">Every /chat, /chat/stream, /resume, and /stream call — cost, context size, and latency, most recent first.</p>
                        </div>
                        <input
                            type="text"
                            value={search}
                            onChange={(e) => setSearch(e.target.value)}
                            placeholder="Search logs..."
                            className="bg-background border border-border rounded px-3 py-1.5 text-xs text-neutral-200 font-mono focus:outline-none focus:border-primary w-64"
                        />
                    </div>

                    <div className="flex-1 overflow-auto">
                        {loading ? (
                            <div className="h-full flex items-center justify-center text-neutral-500 text-sm">Loading...</div>
                        ) : filtered.length === 0 ? (
                            <div className="h-full flex flex-col items-center justify-center text-neutral-500 text-sm italic">
                                <div>{logs.length === 0 ? 'No API runs logged yet.' : 'No logs match your search.'}</div>
                                {logs.length === 0 && (
                                    <div className="text-xs text-neutral-600 mt-2">Trigger a /chat, /resume, or /stream call to see it here.</div>
                                )}
                            </div>
                        ) : (
                            <table className="w-full text-xs">
                                <thead className="sticky top-0 bg-surface/90 backdrop-blur z-10">
                                    <tr className="text-left text-neutral-500 uppercase tracking-wider border-b border-border">
                                        <th className="px-4 py-2 font-semibold">Created At</th>
                                        <th className="px-4 py-2 font-semibold">Session</th>
                                        <th className="px-4 py-2 font-semibold">Endpoint</th>
                                        <th className="px-4 py-2 font-semibold">Agent</th>
                                        <th className="px-4 py-2 font-semibold">Status</th>
                                        <th className="px-4 py-2 font-semibold text-right">Tokens</th>
                                        <th className="px-4 py-2 font-semibold text-right">Cost</th>
                                        <th className="px-4 py-2 font-semibold text-right">Context</th>
                                        <th className="px-4 py-2 font-semibold text-right">Latency</th>
                                        <th className="px-4 py-2 font-semibold">Error</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filtered.map((log) => (
                                        <tr key={log.id} className="border-b border-border/40 hover:bg-white/5 transition-colors">
                                            <td className="px-4 py-2 text-neutral-400 whitespace-nowrap font-mono">
                                                {log.created_at ? new Date(log.created_at.replace(' ', 'T') + 'Z').toLocaleString() : '—'}
                                            </td>
                                            <td className="px-4 py-2 font-mono text-neutral-300 max-w-[160px] truncate" title={log.session_id}>{log.session_id}</td>
                                            <td className="px-4 py-2 font-mono text-neutral-400">{log.endpoint}</td>
                                            <td className="px-4 py-2 text-neutral-300">{log.agent || '—'}</td>
                                            <td className="px-4 py-2">
                                                <div className="flex items-center gap-1.5">
                                                    <span className={`shrink-0 w-1.5 h-1.5 rounded-full ${statusDotClass(log.status)}`}></span>
                                                    <span className="text-neutral-300">{log.status}</span>
                                                </div>
                                            </td>
                                            <td className="px-4 py-2 text-right font-mono text-blue-400">
                                                {(log.tokens_delta ?? 0).toLocaleString()} / {(log.total_tokens ?? 0).toLocaleString()}
                                            </td>
                                            <td className="px-4 py-2 text-right font-mono text-emerald-400">
                                                ${(log.cost_delta ?? 0).toFixed(5)} / ${(log.total_cost ?? 0).toFixed(4)}
                                            </td>
                                            <td className="px-4 py-2 text-right text-neutral-400">{log.message_count ?? '—'} msgs</td>
                                            <td className="px-4 py-2 text-right font-mono text-neutral-400">{log.latency_ms ?? '—'} ms</td>
                                            <td className="px-4 py-2 text-red-400 max-w-[220px] truncate" title={log.error || ''}>{log.error || ''}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        )}
                    </div>
                </div>
            );
        };

        const Monitor = () => {
            const [mainTab, setMainTab] = useState('dashboard');
            // Same lazy-init + persistence-effect idiom as architectSessions below — falls back
            // to the OS/browser preference on a first visit with nothing saved yet, and to dark
            // (today's only look) if that preference can't be read.
            const [theme, setTheme] = useState(() => {
                const saved = localStorage.getItem('theme');
                if (saved) return saved;
                return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                    ? 'light' : 'dark';
            });
            // fetchConfig (below) is invoked from a setInterval set up inside a mount-only
            // (deps: []) effect, so a closure over `theme` there would only ever see its
            // mount-time value on every periodic poll — not just delayed, permanently stale,
            // re-clobbering the toggle's fix every 3s. A ref sidesteps that without needing to
            // restart the polling interval on every theme change.
            const themeRef = useRef(theme);
            useEffect(() => {
                themeRef.current = theme;
                document.documentElement.className = theme === 'light' ? 'light' : 'dark';
                localStorage.setItem('theme', theme);
            }, [theme]);
            const [isRightPaneOpen, setIsRightPaneOpen] = useState(true);
            const [nodes, setNodes] = useState([]);
            const [edges, setEdges] = useState([]);
            // Dragged node positions survive fetchConfig's 3s poll via the prevNodes diff below
            // (see fetchConfig), but that's in-memory React state — it doesn't survive a browser
            // refresh, which resets nodes back to []. Persisting to localStorage, keyed per
            // project (so two differently-named projects opened in the same browser don't clobber
            // each other's saved layout), closes that gap. configNameRef exists because
            // onNodeDragStop needs the current project's name to key the save, but shouldn't be
            // recreated (and re-subscribed to ReactFlow) every time fetchConfig's poll updates it.
            const configNameRef = useRef(null);
            const STUDIO_LAYOUT_PREFIX = 'studioLayout:';
            const loadStoredLayout = (projectName) => {
                if (!projectName) return {};
                try {
                    return JSON.parse(localStorage.getItem(STUDIO_LAYOUT_PREFIX + projectName) || '{}');
                } catch (e) {
                    return {};
                }
            };
            // Ephemeral dynamic-agent nodes/edges (see spawn_agent) — kept separate from
            // nodes/edges (which fetchConfig overwrites wholesale on every 3s poll, since it's
            // purely ai.yaml-derived) and layered on top at render time in displayNodes/
            // displayEdges below, so a dynamically-spawned agent survives fetchConfig's poll
            // instead of vanishing on the next tick.
            const [dynamicAgentNodes, setDynamicAgentNodes] = useState([]);
            const [dynamicAgentEdges, setDynamicAgentEdges] = useState([]);
            const [sessions, setSessions] = useState([]);
            const [rightTab, setRightTab] = useState('playground'); // playground | traces
            const [playgroundMessages, setPlaygroundMessages] = useState([]);
            const [streamingAgent, setStreamingAgent] = useState(null);
            const [liveErrors, setLiveErrors] = useState([]); // recent backend errors, visible from any tab
            const [liveRouterIssues, setLiveRouterIssues] = useState([]); // routers/available_when that evaluated with an error — see router_decision handling below
            const [contextWindow, setContextWindow] = useState(128000);

            // Session Management
            const [activeSessionId, setActiveSessionId] = useState('playground');
            const [activeTraceId, setActiveTraceId] = useState(null);
            const [historyLoadedFor, setHistoryLoadedFor] = useState(null);

            // Auto-select first trace if none selected
            useEffect(() => {
                if (sessions.length > 0 && !activeTraceId) {
                    setActiveTraceId(sessions[0].session_id);
                }
            }, [sessions, activeTraceId]);

            // Auto-load the active session's saved history once it shows up in the periodic
            // /api/memory fetch — previously nothing did this, so reloading the page (or just
            // opening the Playground fresh) always showed an empty chat even when the session
            // already had real history saved server-side. Guarded so it never fires more than
            // once per session id, and never overwrites messages already in progress locally
            // (a live send, or a reply still streaming in) with a possibly-stale server copy.
            useEffect(() => {
                if (historyLoadedFor === activeSessionId) return;
                const sess = sessions.find(s => s.session_id === activeSessionId);
                if (!sess) return;
                if (playgroundMessages.length === 0 && sess.messages && sess.messages.length > 0) {
                    setPlaygroundMessages(sess.messages);
                }
                setHistoryLoadedFor(activeSessionId);
            }, [sessions, activeSessionId]);

            const handleContinueChat = (id) => {
                setActiveSessionId(id);
                const sess = sessions.find(s => s.session_id === id);
                if (sess) setPlaygroundMessages(sess.messages || []);
                setRightTab('playground');
            };

            // Architect Chat State — keyed per-project, same reasoning as STUDIO_LAYOUT_PREFIX
            // above: `inta monitor` defaults to the same port (3000) for every project, so two
            // differently-named projects opened in the same browser land on the same origin and
            // previously shared one global 'architectSessions' key — opening a second project
            // showed the first project's Architect chat history verbatim. Starts with a
            // placeholder session; the real per-project sessions are swapped in once fetchConfig
            // learns the project name (the projectName effect below), and are never persisted
            // under the placeholder until that happens.
            const ARCHITECT_SESSIONS_PREFIX = 'architectSessions:';
            const ARCHITECT_ACTIVE_SESSION_PREFIX = 'activeArchSessionId:';
            const [projectName, setProjectName] = useState(null);
            const [architectSessions, setArchitectSessions] = useState(() => (
                [{ id: Date.now().toString(), name: 'Session 1', messages: [] }]
            ));
            const [activeArchSessionId, setActiveArchSessionId] = useState(() => Date.now().toString());
            // Guards the load effect below to run at most once per project name, and skips the
            // persist effect's very next run so the just-loaded value doesn't get immediately
            // clobbered by a stale write of the placeholder session from the same render pass.
            const architectSessionsLoadedForRef = useRef(null);
            const skipNextArchitectPersistRef = useRef(false);

            useEffect(() => {
                if (!projectName || architectSessionsLoadedForRef.current === projectName) return;
                architectSessionsLoadedForRef.current = projectName;
                try {
                    const saved = localStorage.getItem(ARCHITECT_SESSIONS_PREFIX + projectName);
                    const savedActive = localStorage.getItem(ARCHITECT_ACTIVE_SESSION_PREFIX + projectName);
                    if (saved || savedActive) {
                        skipNextArchitectPersistRef.current = true;
                        if (saved) setArchitectSessions(JSON.parse(saved));
                        if (savedActive) setActiveArchSessionId(savedActive);
                    }
                } catch (e) { }
            }, [projectName]);

            const activeArchSession = architectSessions.find(s => s.id === activeArchSessionId) || architectSessions[0];
            const architectMessages = activeArchSession ? activeArchSession.messages : [];

            const architectScrollRef = useRef(null);

            // Self-heal a mismatched activeArchSessionId: the two useState initializers above
            // independently call Date.now() as their fallback default (when localStorage is
            // empty, i.e. a browser's first-ever visit), and those two calls are not guaranteed to
            // produce the same value. When they don't match, updateArchitectMessages below (which
            // looks up the session by exact id, with no fallback) silently no-ops on every send —
            // the reply never appears and nothing ever gets persisted, and the mismatched id then
            // gets written straight back to localStorage, making it a permanent, cross-reload
            // break for that browser until this correction runs. Also covers the session having
            // been deleted out from under an active id.
            useEffect(() => {
                if (architectSessions.length > 0 && !architectSessions.some(s => s.id === activeArchSessionId)) {
                    setActiveArchSessionId(architectSessions[0].id);
                }
            }, [architectSessions, activeArchSessionId]);

            useEffect(() => {
                if (!projectName || architectSessionsLoadedForRef.current !== projectName) return;
                if (skipNextArchitectPersistRef.current) {
                    skipNextArchitectPersistRef.current = false;
                    return;
                }
                localStorage.setItem(ARCHITECT_SESSIONS_PREFIX + projectName, JSON.stringify(architectSessions));
                localStorage.setItem(ARCHITECT_ACTIVE_SESSION_PREFIX + projectName, activeArchSessionId);
            }, [architectSessions, activeArchSessionId, projectName]);

            const updateArchitectMessages = (newMsgs) => {
                setArchitectSessions(prev => prev.map(s => s.id === activeArchSessionId ? { ...s, messages: newMsgs } : s));
            };

            const createNewArchSession = () => {
                const newId = Date.now().toString();
                setArchitectSessions(prev => [...prev, { id: newId, name: `Session ${prev.length + 1}`, messages: [] }]);
                setActiveArchSessionId(newId);
            };

            const [isArchitectTyping, setIsArchitectTyping] = useState(false);
            const [isChatExpanded, setIsChatExpanded] = useState(false);

            useEffect(() => {
                const el = architectScrollRef.current;
                if (!el) return;
                // Deferred to the next animation frame — setting scrollTop in the same tick the
                // container goes from `display: none` (collapsed) to visible doesn't stick, since
                // layout for the newly-visible content hasn't been flushed yet at that point even
                // though scrollHeight already reads a value; requestAnimationFrame runs after the
                // browser's next layout/paint, once it actually has.
                requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
                // Keyed on isChatExpanded too, not just message count/content — the container is
                // `display: none` while collapsed, and expanding it doesn't itself change the
                // message list, so without this the effect never re-ran once the panel opened.
            }, [architectMessages.length, architectMessages[architectMessages.length - 1]?.content, isChatExpanded]);

            // Draggable State



            const activeAgent = React.useMemo(() => {
                return streamingAgent;
            }, [streamingAgent]);

            const displayNodes = React.useMemo(() => {
                return [...nodes, ...dynamicAgentNodes].map(n => {
                    if (n.id === activeAgent) {
                        return {
                            ...n,
                            style: {
                                ...n.style,
                                border: '3px solid #10b981',
                                background: 'rgba(16, 185, 129, 0.25)',
                                boxShadow: '0 0 40px 5px rgba(16, 185, 129, 0.6)',
                                transition: 'all 0.3s ease'
                            }
                        };
                    }
                    // Ephemeral (spawn_agent) nodes already carry their own dashed styling from
                    // creation time — leave them alone rather than forcing the static-agent look.
                    if (n.data?.ephemeral) {
                        return n;
                    }
                    if (n.id !== 'user' && !n.id.startsWith('tool-')) {
                        return {
                            ...n,
                            style: {
                                ...n.style,
                                border: '1px solid rgba(99, 102, 241, 0.3)',
                                boxShadow: '0 4px 20px -5px rgba(99, 102, 241, 0.1)',
                                transition: 'all 0.3s ease'
                            }
                        };
                    }
                    return n;
                });
            }, [nodes, dynamicAgentNodes, activeAgent]);

            const displayEdges = React.useMemo(
                () => [...edges, ...dynamicAgentEdges],
                [edges, dynamicAgentEdges]
            );

            const onNodesChange = useCallback(changes => setNodes(nds => applyNodeChanges(changes, nds)), []);
            const onEdgesChange = useCallback(changes => setEdges(eds => applyEdgeChanges(changes, eds)), []);

            // Live Execution Event Listener
            useEffect(() => {
                const sse = new EventSource('/api/stream/events');
                sse.onmessage = (e) => {
                    try {
                        const event = JSON.parse(e.data);

                        if (event.type === 'handoff') {
