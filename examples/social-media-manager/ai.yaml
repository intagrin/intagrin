name: "social-media-manager"
version: "1.0"
default_agent: "research_agent"

model:
  primary: "gemini/gemini-3.5-flash-lite"
  fallback: "gemini/gemini-3.5-flash"
  temperature: 0.7
  use_cache: true
  guardrails:
    mask_pii: true

circuit_breakers:
  max_handoffs_per_session: 10
  max_parallel_fan_out: 5

memory:
  type: "sqlite"
  db_path: ".ai/memory.db"

telemetry:
  - "otel"

server:
  auth:
    type: "api_key"
    env_var: "INTAGRIN_API_KEY"
    approver_env_var: "INTAGRIN_APPROVER_KEY"

agents:
  research_agent:
    description: "Identifies and researches trending AI and IT topics from live web sources with depth and rigor."
    system_prompt_file: "prompts/research_agent.jinja2"
    lazy_load_tools: true
    handoffs:
      - "content_generator_agent"
      - "reviewer_agent"
    tools:
      - name: "fetch_trending_ai_topics"
        module: "tools.custom_tools"

  content_generator_agent:
    description: "Conducts deep research on the chosen topic and drafts engaging, high-impact LinkedIn posts."
    system_prompt_file: "prompts/content_generator_agent.jinja2"
    lazy_load_tools: true
    handoffs:
      - "reviewer_agent"
      - "research_agent"
    tools:
      - name: "search_topic_details"
        module: "tools.custom_tools"

  reviewer_agent:
    description: "Reviews post quality, clarity, and tone using rigorous editorial standards, then publishes approved content to LinkedIn."
    system_prompt_file: "prompts/reviewer_agent.jinja2"
    lazy_load_tools: true
    handoffs:
      - "content_generator_agent"
      - "research_agent"
    tools:
      - name: "post_to_linkedin"
        module: "tools.custom_tools"
        requires_approval: true
