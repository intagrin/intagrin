[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intagrin"
version = "0.1.0"
description = "The definitive Python framework for enterprise AI agents and autonomous swarms."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Anoop P S", email = "hello@intagrin.com" },
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "litellm>=1.35.0",
    "mcp>=1.0.0",
    "ruamel.yaml>=0.18.6",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-api>=1.24.0",
    "Jinja2>=3.1.3",
    "python-dotenv>=1.0.1",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "gunicorn>=21.2.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.1.0"]
redis = ["redis>=5.0.0"]

[project.urls]
Homepage = "https://github.com/intagrin/intagrin"
Documentation = "https://docs.intagrin.com/"
Repository = "https://github.com/intagrin/intagrin"
Issues = "https://github.com/intagrin/intagrin/issues"

[project.scripts]
inta = "intagrin.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.jinja2", "*.png", "*.css", "*.js", "*.svg", "templates/*", "templates/copilot/*.md", "templates/copilot/frontmatter/*.md", "templates/copilot/docs/*.md", "static/*", "db_migrations/alembic.ini", "db_migrations/script.py.mako", "db_migrations/README"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# examples/ holds consumer projects built *with* IntaGrin (social-media-manager,
# travel-planner, ...) for docs/demo purposes — not part of the framework package, and not
# held to the framework's own lint bar. Without this, `ruff check .` (what CI actually runs)
# scans straight into them and fails on whatever style choices that example's own code makes,
# which has nothing to do with framework code quality — confirmed by travel-planner/ui/server.py
# tripping E402/F541 the moment it was added.
exclude = ["examples"]

[tool.ruff.lint]
# Pin to ruff's classic error/pyflakes rule set (syntax errors, undefined names, unused
# imports, etc.) rather than an unpinned ruff's full opinionated default, which grew to
# include flake8-bandit (S) and flake8-blind-except (BLE) — rules this codebase deliberately
# violates throughout as an intentional fail-open/fail-safe pattern (see e.g. rate_limiter.py,
# run_logger.py, shared_memory.py: broad `except Exception` is the documented, tested
# architecture, not an oversight to "fix").
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# pytest.importorskip(...) must run before importing the module it gates, so the module-level
# import is deliberately not at the top of the file — the standard pytest pattern for skipping a
# whole file when an optional dependency (psycopg here) isn't installed.
"tests/test_auto_migrate_postgres.py" = ["E402"]
"tests/test_memory_integration.py" = ["E402"]
# Standalone scripts run outside the installed package — sys.path must be extended before the
# `intagrin` import can resolve, so the import can't be moved above it.
"scripts/generate_config_reference.py" = ["E402"]
"scripts/generate_error_docs.py" = ["E402"]
"scripts/generate_ai_schema.py" = ["E402"]
"scripts/generate_orchestration_guide.py" = ["E402"]
