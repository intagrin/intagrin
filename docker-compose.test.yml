# Ephemeral services for exercising the real Postgres/Redis checkpointer backends
# (see tests/test_memory_integration.py, tests/test_auto_migrate_postgres.py).
# Not part of the default CI/test run — start explicitly:
#   docker compose -f docker-compose.test.yml up -d
#   TEST_POSTGRES_URL=postgresql://intagrin:intagrin_test@localhost:5433/intagrin_test \
#   TEST_REDIS_URL=redis://localhost:6380/0 \
#   uv run pytest tests/test_memory_integration.py tests/test_auto_migrate_postgres.py

services:
  postgres-test:
    image: postgres:16
    environment:
      - POSTGRES_USER=intagrin
      - POSTGRES_PASSWORD=intagrin_test
      - POSTGRES_DB=intagrin_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7
    ports:
      - "6380:6379"
